name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Tests use in-memory SQLite (see tests/conftest.py) — no env vars or DB needed.
      - name: Run pytest
        run: uv run pytest

      # Catches a migration that fails to apply to a fresh database.
      - name: Apply migrations to a fresh SQLite DB
        run: uv run alembic upgrade head

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
