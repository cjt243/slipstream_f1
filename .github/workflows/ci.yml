name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Tests use in-memory SQLite (see tests/conftest.py) — no env vars or DB needed.
      - name: Run pytest
        run: uv run pytest

      # Catches a migration that fails to apply to a fresh database.
      - name: Apply migrations to a fresh SQLite DB
        run: uv run alembic upgrade head

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  migrate:
    name: Migrate production DB
    # Only after tests pass on a push to main — never from PRs or previews.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: server
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # Without the URL, alembic would silently migrate a throwaway local dev.db.
      - name: Check Turso secrets are set
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::TURSO_DATABASE_URL and TURSO_AUTH_TOKEN must be set as secrets for the 'production' environment (or the repo)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations to Turso
        run: |
          uv run alembic upgrade head
          uv run alembic current
